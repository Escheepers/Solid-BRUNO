<div class="flex flex-col gap-6 p-8">
  <div class="flex items-center justify-between">
    <h1 class="text-page-title text-text">Customers</h1>
    <app-button (click)="openCreateModal()">+ New Customer</app-button>
  </div>

  <div class="flex items-center gap-4">
    <input
      type="search"
      placeholder="Search customers..."
      aria-label="Search customers"
      class="w-full max-w-sm rounded-md border border-input-border bg-input-bg px-4 py-2 text-body text-text-body placeholder:text-text-faint"
      [value]="searchInput()"
      (input)="onSearchInput($any($event.target).value)"
    />

    <label class="flex items-center gap-2 text-body text-text-body">
      <input
        type="checkbox"
        [checked]="showInactive()"
        (change)="onShowInactiveChange($any($event.target).checked)"
      />
      Show inactive customers
    </label>
  </div>

  @if (isGenuinelyEmpty()) {
    <p class="text-body text-text-muted" aria-live="polite">No customers yet &mdash; create one.</p>
  } @else if (isFilteredEmpty()) {
    <div class="flex flex-col items-start gap-2">
      <p class="text-body text-text-muted" aria-live="polite">No customers match these filters.</p>
      <button type="button" class="text-button text-primary" (click)="clearFilters()">
        Clear all filters
      </button>
    </div>
  } @else {
    <app-data-table
      [columns]="columns"
      [rows]="customers()"
      [loading]="query.isPending()"
      [page]="page()"
      [pageSize]="pageSize"
      [totalCount]="totalCount()"
      [actions]="actions"
      [rowMuted]="rowMuted"
      [rowKey]="rowKey"
      [rowError]="rowError()"
      (pageChange)="onPageChange($event)"
    />
  }

  <app-customer-form-modal
    [open]="isFormModalOpen()"
    [customer]="editingCustomer()"
    (closeRequest)="onFormModalClose()"
  />

  <app-confirm-dialog
    [open]="hardDeleteAction.current() !== null"
    title="Delete this customer?"
    [message]="hardDeleteAction.dialogMessage()"
    confirmLabel="Delete"
    cancelLabel="Cancel"
    (confirm)="hardDeleteAction.confirm()"
    (cancel)="hardDeleteAction.cancel()"
  />

  <app-confirm-dialog
    [open]="deactivateAction.current() !== null"
    title="Deactivate this customer?"
    [message]="deactivateAction.dialogMessage()"
    confirmLabel="Deactivate"
    cancelLabel="Keep active"
    (confirm)="deactivateAction.confirm()"
    (cancel)="deactivateAction.cancel()"
  />

  <app-confirm-dialog
    [open]="eraseAction.current() !== null"
    variant="destructive"
    title="Erase this customer's personal data?"
    [message]="eraseAction.dialogMessage()"
    confirmLabel="Erase"
    cancelLabel="Cancel"
    (confirm)="eraseAction.confirm()"
    (cancel)="eraseAction.cancel()"
  />
</div>
