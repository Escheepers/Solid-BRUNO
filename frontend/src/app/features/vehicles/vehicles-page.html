<div class="flex flex-col gap-6 p-8">
  <div class="flex items-center justify-between">
    <h1 class="text-page-title text-text">Vehicles</h1>
    <app-button (click)="openCreateModal()">+ New Vehicle</app-button>
  </div>

  <input
    type="search"
    placeholder="Search vehicles..."
    aria-label="Search vehicles"
    class="w-full max-w-sm rounded-md border border-input-border bg-input-bg px-4 py-2 text-body text-text-body placeholder:text-text-faint"
    [value]="searchInput()"
    (input)="onSearchInput($any($event.target).value)"
  />

  @if (isGenuinelyEmpty()) {
    <p class="text-body text-text-muted">No vehicles yet &mdash; create one.</p>
  } @else if (isFilteredEmpty()) {
    <div class="flex flex-col items-start gap-2">
      <p class="text-body text-text-muted">No vehicles match these filters.</p>
      <button type="button" class="text-button text-primary" (click)="clearFilters()">
        Clear all filters
      </button>
    </div>
  } @else {
    <app-data-table
      [columns]="columns"
      [rows]="vehicles()"
      [loading]="query.isPending()"
      [page]="page()"
      [pageSize]="pageSize"
      [totalCount]="totalCount()"
      (pageChange)="onPageChange($event)"
    />
  }

  <app-create-vehicle-modal
    [open]="isCreateModalOpen()"
    (closeRequest)="onCreateModalClose()"
  />
</div>
