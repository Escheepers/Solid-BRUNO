<ng-template #statusCell let-booking>
  <app-badge [status]="booking.status" />
</ng-template>

<div class="flex flex-col gap-6 p-8">
  <div class="flex items-center justify-between">
    <h1 class="text-page-title text-text">Bookings</h1>
    <app-button (click)="openCreateModal()">+ New Booking</app-button>
  </div>

  @if (isEmpty()) {
    <p class="text-body text-text-muted">No bookings yet &mdash; create one.</p>
  } @else {
    <app-data-table
      [columns]="columns"
      [rows]="bookings()"
      [loading]="query.isPending()"
      [page]="page()"
      [pageSize]="pageSize"
      [totalCount]="totalCount()"
      [actions]="actions"
      [rowKey]="rowKey"
      (pageChange)="onPageChange($event)"
    />
  }

  <app-booking-form-modal [open]="isFormModalOpen()" (closeRequest)="onFormModalClose()" />

  <app-confirm-dialog
    [open]="cancelAction.current() !== null"
    title="Cancel this booking?"
    [message]="cancelAction.dialogMessage()"
    confirmLabel="Cancel booking"
    cancelLabel="Keep booking"
    (confirm)="cancelAction.confirm()"
    (cancel)="cancelAction.cancel()"
  />
</div>
