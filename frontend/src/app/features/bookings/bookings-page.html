<ng-template #statusCell let-booking>
  <app-badge [status]="displayStatus(booking)" />
</ng-template>

<div class="flex flex-col gap-6 p-8">
  <div class="flex items-center justify-between">
    <h1 class="text-page-title text-text">Bookings</h1>
    <app-button (click)="openCreateModal()">+ New Booking</app-button>
  </div>

  <div class="flex items-center gap-4">
    <input
      type="search"
      placeholder="Search bookings..."
      aria-label="Search bookings"
      class="w-full max-w-sm rounded-md border border-input-border bg-input-bg px-4 py-2 text-body text-text-body placeholder:text-text-faint"
      [value]="searchInput()"
      (input)="onSearchInput($any($event.target).value)"
    />
  </div>

  @if (isGenuinelyEmpty()) {
    <p class="text-body text-text-muted" aria-live="polite">No bookings yet &mdash; create one.</p>
  } @else if (isFilteredEmpty()) {
    <div class="flex flex-col items-start gap-2">
      <p class="text-body text-text-muted" aria-live="polite">No bookings match this search.</p>
      <button type="button" class="text-button text-primary" (click)="clearFilters()">
        Clear search
      </button>
    </div>
  } @else {
    <app-data-table
      [columns]="columns"
      [rows]="bookings()"
      [loading]="query.isPending()"
      [page]="page()"
      [pageSize]="pageSize"
      [totalCount]="totalCount()"
      [actions]="actions"
      [rowKey]="rowKey"
      [sortResetToken]="sortResetToken()"
      (pageChange)="onPageChange($event)"
    />
  }

  <app-booking-form-modal
    [open]="isFormModalOpen()"
    (created)="onCreated()"
    (closeRequest)="onFormModalClose()"
  />

  <app-confirm-dialog
    [open]="cancelAction.current() !== null"
    title="Cancel this booking?"
    [message]="cancelAction.dialogMessage()"
    [isError]="cancelAction.hasError()"
    confirmLabel="Cancel booking"
    cancelLabel="Keep booking"
    (confirm)="cancelAction.confirm()"
    (cancel)="cancelAction.cancel()"
  />
</div>
