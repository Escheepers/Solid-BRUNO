<div class="flex flex-col gap-1">
  @if (label()) {
    <label
      [for]="inputId"
      class="text-section-label uppercase tracking-wide text-text-faint"
      >{{ label() }}</label
    >
  }

  <input
    [id]="inputId"
    [type]="type()"
    [attr.min]="min()"
    [attr.max]="max()"
    [value]="value"
    [disabled]="disabled"
    [attr.aria-invalid]="hasError ? 'true' : null"
    [attr.aria-describedby]="inputId + '-error'"
    class="w-full rounded-md border border-input-border bg-input-bg px-3 py-2 text-body text-text-body placeholder:text-text-faint focus:outline-none focus:ring-2 focus:ring-primary disabled:opacity-60"
    (input)="onInput($event)"
    (blur)="onBlur()"
  />

  <div [id]="inputId + '-error'" aria-live="polite" class="text-caption text-danger-text">
    @if (hasError) {
      {{ error() }}
    }
  </div>
</div>
