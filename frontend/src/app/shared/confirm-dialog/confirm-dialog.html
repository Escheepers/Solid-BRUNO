@if (open()) {
  <div
    data-testid="confirm-dialog-backdrop"
    class="fixed inset-0 z-50 flex items-start justify-center bg-black/50 px-4 pt-16"
    (keydown)="onKeydown($event)"
  >
    <div
      #panel
      role="alertdialog"
      aria-modal="true"
      aria-labelledby="confirm-dialog-title"
      aria-describedby="confirm-dialog-message"
      class="w-full max-w-sm rounded-xl border border-border bg-surface shadow-2xl"
    >
      <div class="border-b border-border px-6 py-4">
        <h2 id="confirm-dialog-title" class="text-page-title text-text">{{ title() }}</h2>
      </div>

      <div class="px-6 py-5">
        <p id="confirm-dialog-message" class="text-body text-text-body">{{ message() }}</p>

        <div class="mt-6 flex justify-end gap-3">
          <button
            type="button"
            class="rounded-md border border-input-border px-[18px] py-[9px] text-button text-text hover:bg-surface-alt"
            (click)="onCancelClick()"
          >
            {{ cancelLabel() }}
          </button>
          <app-button (click)="onConfirmClick()">{{ confirmLabel() }}</app-button>
        </div>
      </div>
    </div>
  </div>
}
