@if (open()) {
  <div
    data-testid="modal-backdrop"
    class="fixed inset-0 z-50 flex items-start justify-center bg-black/50 px-4 pt-16"
    (click)="onBackdropClick()"
    (keydown)="onKeydown($event)"
  >
    <div
      #panel
      role="dialog"
      aria-modal="true"
      [attr.aria-labelledby]="title() ? 'modal-title' : null"
      class="w-full max-w-md rounded-xl border border-border bg-surface shadow-2xl"
      (click)="$event.stopPropagation()"
    >
      <div class="flex items-center justify-between border-b border-border px-6 py-4">
        @if (title()) {
          <h2 id="modal-title" class="text-page-title text-text">{{ title() }}</h2>
        }
        <button
          type="button"
          aria-label="Close"
          class="rounded-sm p-1 text-lg leading-none text-text-muted hover:text-text"
          (click)="onCloseButtonClick()"
        >
          &times;
        </button>
      </div>

      <div class="px-6 py-5">
        <ng-content />
      </div>
    </div>
  </div>
}
